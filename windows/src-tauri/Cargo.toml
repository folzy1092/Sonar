[package]
name = "sonar"
version = "0.1.0"
description = "Sonar — музыкальный плеер: SoundCloud и Яндекс Музыка"
authors = ["Folzy"]
license-file = "../../LICENSE"
repository = "https://github.com/folzy1092/Sonar"
edition = "2024"
rust-version = "1.90"


[lib]
name = "sonar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream", "gzip"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
rusqlite = { version = "0.42", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
souvlaki = "0.9"
md5 = "0.8"
url = "2"
urlencoding = "2"
futures-util = "0.3"
anyhow = "1"
