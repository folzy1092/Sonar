[package]
name = "sonar"
version = "0.1.1"
description = "Sonar — музыкальный плеер: SoundCloud и Яндекс Музыка"
authors = ["Folzy"]
license-file = "../../LICENSE"
repository = "https://github.com/folzy1092/Sonar"
edition = "2024"
rust-version = "1.90"


[lib]
name = "sonar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream", "gzip", "multipart", "form"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
rusqlite = { version = "0.42", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
souvlaki = "0.9"
md5 = "0.8"
url = "2"
urlencoding = "2"
futures-util = "0.3"
anyhow = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-single-instance = "2"
discord-rich-presence = "1.1"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# горячие клавиши по всей системе (hotkeys.rs, Система → Горячие клавиши)
tauri-plugin-global-shortcut = "2"
# Локальные файлы (local.rs, Система → Хранилище → Папки с музыкой): теги и обложки, слежение за папками,
# ref `local:<sha1 пути>`, выбор папки
lofty = "0.22"
notify = "8"
sha1 = "0.10"
tauri-plugin-dialog = "2"

# Кнопки «назад / пауза / вперёд» в превью окна на панели задач (thumbbar.rs) — та же версия, что у Tauri
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
