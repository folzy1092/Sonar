[package]
name = "sonar"
version = "0.1.1"
description = "Sonar — музыкальный плеер: SoundCloud и Яндекс Музыка"
authors = ["Folzy"]
license-file = "../../LICENSE"
repository = "https://github.com/folzy1092/Sonar"
edition = "2024"
rust-version = "1.90"


[lib]
name = "sonar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream", "gzip", "multipart", "form"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
rusqlite = { version = "0.42", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
souvlaki = "0.9"
md5 = "0.8"
url = "2"
urlencoding = "2"
futures-util = "0.3"
anyhow = "1"
regex = "1"
sha2 = "0.10"
# SAPISIDHASH для входа в YouTube Music по cookie (providers/youtube/auth.rs) и TOTP токена веб-плеера
# Spotify (HMAC-SHA1, providers/spotify.rs)
sha1 = "0.10"
base64 = "0.22"
tauri-plugin-single-instance = "2"
discord-rich-presence = "1.1"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# горячие клавиши по всей системе (hotkeys.rs, Система → Горячие клавиши)
tauri-plugin-global-shortcut = "2"
# Локальные файлы (local.rs, Система → Хранилище → Папки с музыкой): теги и обложки, слежение за папками,
# ref `local:<sha1 пути>` (sha1 — выше, общий с YouTube)
lofty = "0.22"
notify = "8"
# окно «Сохранить как» для экспорта плейлистов (export.rs) и выбор папки с музыкой (local)
tauri-plugin-dialog = "2"
# Пульт: iPhone управляет Sonar по Wi-Fi (remote/): WebSocket-сервер в локальной сети, объявление mDNS
# `_sonar._tcp`, QR-код привязки, случайные код и ключ устройства
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
mdns-sd = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
# Поток Spotify Premium (spotify_play.rs) — только с фичей `spotify-playback`, см. [features]
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-audio = { version = "0.8.0", default-features = false, optional = true }
librespot-metadata = { version = "0.8.0", default-features = false, optional = true }

[features]
# Воспроизведение Spotify Premium через librespot. По умолчанию ВЫКЛЮЧЕНО: librespot-core 0.8 не
# собирается «чисто» (сборочный vergen новее 9.0.6 ломает его build.rs — в Cargo.lock закреплён 9.0.6),
# тянет ~290 крейтов, а вход в точку доступа токеном веб-плеера не проверен на живом Premium.
# Без фичи Spotify — источник медиатеки и ссылок, играет резервный сервис (docs/API.md «Spotify»).
spotify-playback = ["dep:librespot-core", "dep:librespot-audio", "dep:librespot-metadata"]

# Кнопки «назад / пауза / вперёд» в превью окна на панели задач (thumbbar.rs) — та же версия, что у Tauri
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
