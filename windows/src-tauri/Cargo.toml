[package]
name = "sonar"
version = "0.1.0"
description = "Sonar — музыкальный плеер: SoundCloud и Яндекс Музыка"
authors = ["Folzy"]
license-file = "../../LICENSE"
repository = "https://github.com/folzy1092/Sonar"
edition = "2024"
rust-version = "1.90"


[lib]
name = "sonar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
