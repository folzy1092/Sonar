<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonar</title>
    <style>
      /* Заставка при запуске и Ctrl+R: в HTML, чтобы появиться до загрузки интерфейса.
         Убирает её src/main.ts (класс .out), не раньше чем через 900 мс. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #050506;
        transition: opacity 380ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash .mark {
        position: relative;
        width: 120px;
        height: 120px;
      }
      #splash img {
        position: relative;
        width: 100%;
        height: 100%;
        animation: splash-logo 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #splash.out img {
        transform: scale(1.08);
        transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash .ring {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1.5px solid rgba(245, 245, 246, 0.5);
        opacity: 0;
        animation: splash-ring 1600ms cubic-bezier(0.2, 0.7, 0.3, 1) 250ms infinite;
      }
      #splash .ring + .ring {
        animation-delay: 800ms;
      }
      @keyframes splash-logo {
        from {
          opacity: 0;
          transform: scale(0.82) rotate(-25deg);
          filter: blur(10px);
        }
      }
      @keyframes splash-ring {
        0% {
          opacity: 0.7;
          transform: scale(0.6);
        }
        100% {
          opacity: 0;
          transform: scale(2.4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash .ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="mark">
        <span class="ring"></span>
        <span class="ring"></span>
        <img src="/logo-mark.svg" alt="" draggable="false" />
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
