<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonar</title>
    <style>
      /* Заставка при запуске и Ctrl+R (в HTML — появляется до загрузки интерфейса). Всё в векторе:
         знак проявляется, раскручивается как вентилятор с разгоном, его копии по кругу смазываются
         в сплошной диск, диск чуть сжимается и тает. Убирает заставку src/main.ts (класс .out). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #050506;
        transition: opacity 420ms cubic-bezier(0.33, 0, 0.2, 1);
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 116px;
        height: 116px;
        overflow: visible;
        color: #f5f5f6;
        animation: sp-life 1500ms cubic-bezier(0.33, 0, 0.2, 1) both;
      }
      #splash .spin,
      #splash .disc {
        transform-box: view-box;
        transform-origin: 512px 512px;
      }
      #splash .spin {
        animation: sp-spin 1500ms both;
      }
      #splash .ghosts {
        opacity: 0;
        animation: sp-ghosts 1500ms linear both;
      }
      #splash .disc {
        opacity: 0;
        animation: sp-disc 1500ms both;
      }
      @keyframes sp-life {
        0% {
          opacity: 0;
        }
        14%,
        82% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes sp-spin {
        0%,
        14% {
          transform: rotate(0deg);
          animation-timing-function: cubic-bezier(0.55, 0, 0.8, 0.35);
        }
        100% {
          transform: rotate(1440deg);
        }
      }
      @keyframes sp-ghosts {
        0%,
        34% {
          opacity: 0;
        }
        70%,
        76% {
          opacity: 0.9;
        }
        90%,
        100% {
          opacity: 0;
        }
      }
      @keyframes sp-disc {
        0%,
        58% {
          opacity: 0;
          transform: scale(0.92);
          animation-timing-function: cubic-bezier(0.33, 0, 0.2, 1);
        }
        78% {
          opacity: 1;
          transform: scale(1);
          animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0.3);
        }
        100% {
          opacity: 1;
          transform: scale(0.82);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .spin,
        #splash .ghosts,
        #splash .disc {
          animation: none;
        }
        #splash .ghosts,
        #splash .disc {
          opacity: 0;
        }
      }
    </style>
  </head>
