<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonar</title>
    <style>
      /* Заставка при запуске и Ctrl+R: в HTML, чтобы появиться до загрузки интерфейса. Векторный знак
         проявляется, раскручивается как вентилятор (с разгоном), расплывается и тает — без колец и
         резких переходов. Убирает заставку src/main.ts (класс .out). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #050506;
        transition: opacity 420ms cubic-bezier(0.33, 0, 0.2, 1);
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 112px;
        height: 112px;
        will-change: transform, opacity, filter;
        animation: splash-spin 1250ms both;
      }
      @keyframes splash-spin {
        0% {
          opacity: 0;
          transform: rotate(0deg) scale(0.96);
          filter: blur(0px);
          animation-timing-function: cubic-bezier(0.33, 0, 0.2, 1);
        }
        22% {
          opacity: 1;
          transform: rotate(0deg) scale(1);
          filter: blur(0px);
          animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0.3);
        }
        100% {
          opacity: 0;
          transform: rotate(1080deg) scale(1.12);
          filter: blur(9px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: splash-fade 1250ms ease both;
        }
        @keyframes splash-fade {
          0%,
          100% {
            opacity: 0;
          }
          30%,
          60% {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/logo-mark.svg" alt="" draggable="false" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
