# XcodeGen: `.xcodeproj` не хранится в git — генерируется (`xcodegen generate` в папке ios/, на CI —
# workflow ios.yml). Структура папок — docs/MAP.md, стек — docs/SPEC.md §4.
name: Sonar
options:
  bundleIdPrefix: com.folzy
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ru

# локальные SwiftPM-пакеты: подпись и zip для автообновления (порт из Shadow, ios/Packages/*/README.md)
packages:
  Zsign:
    path: Packages/Zsign
  ZipArchive:
    path: Packages/ZipArchive

settings:
  base:
    SWIFT_VERSION: "6.0"
    # версия Г.О.Ф (глобальная переделка . новая функция . фикс), номер сборки — на CI
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # подписывает не Xcode: IPA ставится сторонней подписью пользователя (P12 + mobileprovision)
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Sonar:
    type: application
    platform: iOS
    sources:
      - path: Sonar
    dependencies:
      - package: Zsign
      - package: ZipArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folzy.sonar
        PRODUCT_NAME: Sonar
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sonar/Resources/Info.plist
        # иконка — Resources/Assets.xcassets/AppIcon (ios/scripts/gen-appicon.mjs из brand/), как у exe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sonar/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sonar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # музыка играет в фоне и на экране блокировки
        UIBackgroundModes:
          - audio
        # ссылки sonar://track/<ref>, sonar://auth/<code>, sonar://user/<username> (BOT.md, SPEC §4.5а)
        CFBundleURLTypes:
          - CFBundleURLName: com.folzy.sonar
            CFBundleURLSchemes:
              - sonar
        # адрес API не зашит в код (SPEC §3.2); до сервера не используется
        SonarAPIBaseURL: https://sonar-api.folzy.ru
        # автообновление: локальный сервер установки на 127.0.0.1 (как в Shadow, SPEC §4.6)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  SonarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SonarTests
    dependencies:
      - target: Sonar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.folzy.sonar.tests

schemes:
  Sonar:
    build:
      targets:
        Sonar: all
        SonarTests: [test]
    test:
      targets:
        - SonarTests
