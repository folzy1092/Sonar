# XcodeGen: `.xcodeproj` не хранится в git — генерируется (`xcodegen generate` в папке ios/, на CI —
# workflow ios.yml). Структура папок — docs/MAP.md, стек — docs/SPEC.md §4.
name: Sonar
options:
  bundleIdPrefix: com.folzy
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ru

# локальные SwiftPM-пакеты: подпись и zip для автообновления (порт из Shadow, ios/Packages/*/README.md)
packages:
  Zsign:
    path: Packages/Zsign
  ZipArchive:
    path: Packages/ZipArchive

settings:
  base:
    SWIFT_VERSION: "6.0"
    # версия Г.О.Ф (глобальная переделка . новая функция . фикс), номер сборки — на CI
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # подписывает не Xcode: IPA ставится сторонней подписью пользователя (P12 + mobileprovision)
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    # бот отчётов о сбоях — подставляет CI из секретов SONAR_REPORT_*; в репо пусто
    SONAR_REPORT_BOT_TOKEN: ""
    SONAR_REPORT_CHAT: ""
    SONAR_REPORT_THREAD: ""

targets:
  Sonar:
    type: application
    platform: iOS
    sources:
      - path: Sonar
    dependencies:
      - package: Zsign
      - package: ZipArchive
      # виджет «Домой» — встраивается в Sonar.app/PlugIns/SonarWidget.appex
      - target: SonarWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folzy.sonar
        PRODUCT_NAME: Sonar
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sonar/Resources/Info.plist
        # иконка — Resources/Assets.xcassets/AppIcon (ios/scripts/gen-appicon.mjs из brand/), как у exe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sonar/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sonar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # музыка играет в фоне и на экране блокировки
        UIBackgroundModes:
          - audio
        # ссылки sonar://track/<ref>, sonar://auth/<code>, sonar://user/<username> (BOT.md, SPEC §4.5а)
        CFBundleURLTypes:
          - CFBundleURLName: com.folzy.sonar
            CFBundleURLSchemes:
              - sonar
        # адрес API не зашит в код (SPEC §3.2); до сервера не используется
        SonarAPIBaseURL: https://sonar-api.folzy.ru
        # бот отчётов о сбоях (Core/Diagnostics/ReportBot.swift); пусто — «Отправить лог» = «Поделиться»
        SonarReportBotToken: $(SONAR_REPORT_BOT_TOKEN)
        SonarReportChat: $(SONAR_REPORT_CHAT)
        SonarReportThread: $(SONAR_REPORT_THREAD)
        # тип файла профиля подписи — чтобы при выборе в «Файлах» были видны только .mobileprovision
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.mobileprovision
            UTTypeDescription: Provisioning Profile
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobileprovision
        # автообновление: локальный сервер установки на 127.0.0.1 (как в Shadow, SPEC §4.6)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # пульт: поиск Sonar на ПК в той же сети Wi-Fi (Bonjour) и связь с ним (Core/Remote, docs/API.md «Пульт»)
        NSLocalNetworkUsageDescription: Sonar ищет компьютеры с Sonar в твоей сети Wi-Fi, чтобы управлять музыкой на них с телефона.
        NSBonjourServices:
          - _sonar._tcp

  # Виджет «Домой» (WidgetKit): статичные кнопки «Любимые», Sonar Mix, «Быстрый плейлист» — открывают Sonar
  # ссылкой sonar://play/… App Groups нет (сторонняя подпись их не даёт), поэтому данных приложения виджет
  # не читает. Там же (iOS 18) — кнопка Sonar Mix в Пункте управления (ControlWidget, значок — свой символ
  # SonarWidget/Assets.xcassets/sonar.mark.symbolset из ios/scripts/gen-symbol.mjs) и значки экрана блокировки.
  # Отдельного расширения под них нет — одна .appex, одна подпись. Подпись: zsign / ESign подписывают .appex
  # тем же профилем; профиль не на «*» — расширение убирается при установке (BundlePreparer,
  # docs/ROADMAP.md «Блок I»), Sonar работает и без него.
  SonarWidget:
    type: app-extension
    platform: iOS
    sources:
      # вместе с en.lproj / uk.lproj — переводы подписей виджетов по языку системы (ключ — русская строка)
      - path: SonarWidget
      # общие с приложением файлы — только фигуры значков и цели ссылок, без темы и настроек
      - path: Sonar/DesignSystem/Icons/IconPaths.swift
      - path: Sonar/DesignSystem/Icons/IconShape.swift
      - path: Sonar/Core/Shortcuts/PlayTarget.swift
      # интент кнопки Пункта управления: с openAppWhenRun он должен быть и в приложении, и в расширении
      - path: Sonar/Core/Shortcuts/OpenWaveIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.folzy.sonar.widget
        PRODUCT_NAME: SonarWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SonarWidget/Info.plist
        SKIP_INSTALL: YES
    info:
      path: SonarWidget/Info.plist
      properties:
        CFBundleDisplayName: Sonar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SonarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SonarTests
    dependencies:
      - target: Sonar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.folzy.sonar.tests

schemes:
  Sonar:
    build:
      targets:
        Sonar: all
        SonarTests: [test]
    test:
      targets:
        - SonarTests
