<!doctype html>

<title>Sonar — варианты заставки, раунд 2</title>
<style>
  :root { color-scheme: dark; --bg: #050506; --fg: #f5f5f6; --muted: #8b8b93; --line: #1d1d22; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0b0d; color: var(--fg);
    font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    padding: clamp(14px, 3vw, 32px) clamp(14px, 3vw, 40px) 60px;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 20px; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  button {
    font: inherit; color: var(--fg); background: #17171b; border: 1px solid #26262c;
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }
  button:hover { background: #1f1f24; border-color: #33333a; }
  #all { margin-left: 0; }
  .snd { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  select { font: inherit; color: var(--fg); background: #17171b; border: 1px solid #26262c; border-radius: 8px; padding: 6px 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 28px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 12px 0 2px; display: flex; gap: 8px; align-items: center; }
  .card h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .card p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; }

  /* сцена: макет интерфейса + заставка поверх */
  .stage {
    position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 12px;
    border: 1px solid var(--line); background: #0e0e11; container-type: size; cursor: pointer;
  }
  .stage:fullscreen { border-radius: 0; border: 0; aspect-ratio: auto; }
  .app { position: absolute; inset: 0; display: grid; grid-template-columns: 19% 1fr; gap: 1.4cqh; padding: 1.4cqh; }
  .side, .main { background: #131317; border-radius: 1.6cqh; }
  .side { padding: 3cqh 2cqh; display: flex; flex-direction: column; gap: 2.2cqh; }
  .side i { display: block; height: 2.2cqh; border-radius: 1cqh; background: #1f1f25; }
  .side i:nth-child(1) { width: 60%; background: #2a2a31; }
  .side i:nth-child(odd) { width: 74%; }
  .main { padding: 3cqh; display: flex; flex-direction: column; gap: 3cqh; }
  .search { height: 5cqh; width: 46%; border-radius: 2.5cqh; background: #1c1c21; }
  .hero { height: 26cqh; border-radius: 1.6cqh; background: linear-gradient(120deg, #2b1d3a, #13243a 60%, #102a2a); }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2cqh; }
  .tiles b { aspect-ratio: 1; border-radius: 1.2cqh; background: #1d1d22; }
  .tiles b:nth-child(1) { background: linear-gradient(135deg, #5a2c2c, #2a1616); }
  .tiles b:nth-child(2) { background: linear-gradient(135deg, #2c4a5a, #142229); }
  .tiles b:nth-child(3) { background: linear-gradient(135deg, #4a4a2c, #222214); }
  .tiles b:nth-child(4) { background: linear-gradient(135deg, #3a2c5a, #191429); }
  .tiles b:nth-child(5) { background: linear-gradient(135deg, #2c5a3e, #14291c); }
  .mini { position: absolute; left: 1.4cqh; right: 1.4cqh; bottom: 1.4cqh; height: 9cqh; border-radius: 1.6cqh; background: #18181d; }
  .app { padding-bottom: 12cqh; }

  .splash { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); }
  .splash svg { position: relative; z-index: 1; width: min(112px, 20cqh); height: min(112px, 20cqh); overflow: visible; color: var(--fg); opacity: 0; }
  .ring {
    position: absolute; left: 50%; top: 50%; width: min(112px, 20cqh); aspect-ratio: 1;
    translate: -50% -50%; border-radius: 50%; border: 1px solid rgb(245 245 246 / 0.5); opacity: 0;
  }
  .sheen { position: absolute; inset: 0; pointer-events: none; }
</style>

<body>

<!-- сэмплы VCSL (CC0): node pack-samples.mjs samples → samples.js; сами WAV и samples.js в git не идут -->
<script src="samples.js"></script>

<template id="tpl">
  <div class="card">
    <div class="stage">
      <div class="app">
        <div class="side"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="main"><div class="search"></div><div class="hero"></div><div class="tiles"><b></b><b></b><b></b><b></b><b></b></div></div>

<script>
CSS.registerProperty?.({ name: '--r', syntax: '<length>', inherits: false, initialValue: '0px' })

const OUT = 'cubic-bezier(0.22, 1, 0.36, 1)'      // мягкое торможение
const INOUT = 'cubic-bezier(0.65, 0, 0.35, 1)'    // плавно туда-обратно
const SOFT = 'cubic-bezier(0.4, 0, 0.2, 1)'

const anim = (el, frames, o) => el.animate(frames, { fill: 'both', easing: OUT, ...o })

// общий уход: фон гаснет, интерфейс «наводится на резкость» — без сдвигов
function reveal(s, at, dur = 620) {
  anim(s.splash, [{ opacity: 1 }, { opacity: 0 }], { delay: at, duration: dur, easing: SOFT })
  anim(s.app, [{ filter: 'blur(10px)', scale: 1.025 }, { filter: 'blur(0)', scale: 1 }], { delay: at - 40, duration: dur + 200 })
  anim(s.mini, [{ filter: 'blur(10px)', opacity: 0.6 }, { filter: 'blur(0)', opacity: 1 }], { delay: at - 40, duration: dur + 200 })
}

const clamp = (t) => Math.min(1, Math.max(0, t))
const eo3 = (t) => 1 - (1 - t) ** 3
const eo5 = (t) => 1 - (1 - t) ** 5
const eio = (t) => (t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2)
const PATH = document.getElementById('logo')
const D_ALL = PATH.getAttribute('d')
const LEN = PATH.getTotalLength()
const SAMPLES = Array.from({ length: 900 }, (_, i) => {
  const p = PATH.getPointAtLength((i / 899) * LEN)
  return [p.x, p.y]
})
// разрывы между частями знака — чтобы линия не перескакивала через пустоту
SAMPLES.forEach((p, i) => (p.brk = i > 0 && Math.hypot(p[0] - SAMPLES[i - 1][0], p[1] - SAMPLES[i - 1][1]) > 40))

function geo(s) {
  const sr = s.splash.getBoundingClientRect(), vr = s.svg.getBoundingClientRect()
  const ox = vr.left - sr.left, oy = vr.top - sr.top, k = vr.width / 900
  return { w: sr.width, h: sr.height, L: vr.width, cx: ox + vr.width / 2, cy: oy + vr.height / 2,
    map: (x, y) => [ox + (x - 62) * k, oy + (y - 62) * k] }
}
function canvas(s) {
  const g = geo(s), c = document.createElement('canvas'), d = devicePixelRatio
  c.width = g.w * d; c.height = g.h * d
  c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%'
  s.splash.prepend(c); s.cleanup.push(() => c.remove())
  const ctx = c.getContext('2d'); ctx.scale(d, d)
  return { c, ctx, g }
}
function loop(s, dur, fn) {
  s.frames.push(fn) // для покадровой проверки
  const t0 = performance.now()
  const f = (now) => { const ms = now - t0; fn(ms); if (ms < dur && s.alive()) requestAnimationFrame(f) }
  requestAnimationFrame(f)
}
const GLOW = [
  { filter: 'drop-shadow(0 0 0px rgb(255 255 255 / 0))' },
  { filter: 'drop-shadow(0 0 24px rgb(255 255 255 / 0.45))', offset: 0.45 },
  { filter: 'drop-shadow(0 0 0px rgb(255 255 255 / 0))' },
]
const exit = (s, at) => {
  anim(s.svg, [{ opacity: 1, scale: 1 }, { opacity: 0, scale: 1.06 }], { delay: at, duration: 480, easing: SOFT, fill: 'forwards' })
  reveal(s, at + 40)
}

// ── звук заставки: настоящие инструменты (CC0, VCSL), аккорд в ритм волн ──
const AC = new AudioContext()
const BUF = {}
const READY = Promise.all(Object.entries(window.SAMPLES || {}).map(async ([k, b64]) => {
  const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))
  BUF[k] = await AC.decodeAudioData(bin.buffer)
}))
const BUS = (() => {
  const master = AC.createGain(); master.gain.value = 0.9
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 2.5; comp.attack.value = 0.01
  // мягкий зал: стерео-шум с экспоненциальным спадом 2,4 с, предзадержка 18 мс, тёмный
  const rev = AC.createConvolver(), sec = 1.4, len = AC.sampleRate * sec, ir = AC.createBuffer(2, len, AC.sampleRate)
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch), pre = Math.round(AC.sampleRate * 0.018)
    for (let i = pre; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp((-6.5 * (i - pre)) / len)
  }
  rev.buffer = ir
  const wetLp = AC.createBiquadFilter(); wetLp.type = 'lowpass'; wetLp.frequency.value = 3800
  const wet = AC.createGain(); wet.gain.value = 0.28
  const dry = AC.createGain(), send = AC.createGain()
  send.connect(rev); rev.connect(wetLp); wetLp.connect(wet)
  dry.connect(comp); wet.connect(comp); comp.connect(master); master.connect(AC.destination)
  window.__master = master // для проверки уровня
  return { dry, send }
})()

// один сэмпл: громкость, сдвиг в полутонах, панорама, фильтр, атака (для «подложки»), отправка в зал
function hit(t, key, { gain = 0.4, semi = 0, pan = 0, lp = 9000, attack = 0, dur = 3, rev = 1 } = {}) {
  const src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(), p = AC.createStereoPanner()
  src.buffer = BUF[key]; src.playbackRate.value = 2 ** (semi / 12)
  f.type = 'lowpass'; f.frequency.value = lp
  p.pan.value = pan
  if (attack) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack) }
  else g.gain.setValueAtTime(gain, t)
  g.gain.setTargetAtTime(0.0001, t + dur * 0.6, dur * 0.18)
  src.connect(f); f.connect(g); g.connect(p); p.connect(BUS.dry)
  const s = AC.createGain(); s.gain.value = rev; p.connect(s); s.connect(BUS.send)
  src.start(t); src.stop(t + dur + 0.6)
}
const S = {
  kick: 'BDrumNew_hit_v2_rr1_Sum', glass: 'glass1_D#4_Slow_1_Decay', wind: 'windchimes_slowAsc1',
  pE3: 'GPiano_sus_E3_v1_rr1_Player', pD4: 'GPiano_sus_D4_v1_rr1_Player', pE4: 'GPiano_sus_E4_v1_rr1_Player', pB4: 'GPiano_sus_B4_v3_rr1_Player',
  vE3: 'Vibes_soft_E3_v1_rr2_Main', vB3: 'Vibes_soft_B3_v1_rr1_Main', vD4: 'Vibes_soft_D4_v1_rr1_Main', vA4: 'Vibes_soft_A4_v1_rr1_Main', vE5: 'Vibes_soft_E5_v1_rr1_Main',
  cE4: 'sus_E4_r01_main', cE5: 'sus_E5_r01_main',
}
// волны в D стартуют на 0 и 240 мс; только рояль, короткий хвост (~1,3 с), без подложки и колокольчиков
const piano = (t, key, o) => hit(t, key, { dur: 1.25, rev: 0.45, lp: 2600, ...o })
const kick = (t) => hit(t, S.kick, { gain: 0.3, lp: 700, rev: 0.1, dur: 0.5 })
const SOUNDS = {
  'Рояль': (t) => {
    kick(t)
    piano(t, S.pE3, { gain: 0.55, pan: -0.15 })
    piano(t + 0.018, S.pB4, { gain: 0.28, pan: 0.15 })
    piano(t + 0.24, S.pD4, { gain: 0.3 })
    piano(t + 0.258, S.pE4, { gain: 0.24, pan: 0.2 })
  },
  'Рояль, без бочки': (t) => {
    piano(t, S.pE3, { gain: 0.55, pan: -0.15 })
    piano(t + 0.018, S.pB4, { gain: 0.28, pan: 0.15 })
    piano(t + 0.24, S.pD4, { gain: 0.3 })
    piano(t + 0.258, S.pE4, { gain: 0.24, pan: 0.2 })
  },
  'Рояль, ярче': (t) => {
    kick(t)
    piano(t, S.pE3, { gain: 0.5, pan: -0.15, lp: 6000 })
    piano(t + 0.018, S.pB4, { gain: 0.26, pan: 0.15, lp: 6000 })
    piano(t + 0.24, S.pD4, { gain: 0.28, lp: 6000 })
    piano(t + 0.258, S.pE4, { gain: 0.22, pan: 0.2, lp: 6000 })
  },
  'Рояль, совсем коротко': (t) => {
    kick(t)
    piano(t, S.pE3, { gain: 0.55, pan: -0.15, dur: 0.8, rev: 0.3 })
    piano(t + 0.018, S.pB4, { gain: 0.28, pan: 0.15, dur: 0.8, rev: 0.3 })
    piano(t + 0.24, S.pD4, { gain: 0.3, dur: 0.75, rev: 0.3 })
    piano(t + 0.258, S.pE4, { gain: 0.24, pan: 0.2, dur: 0.75, rev: 0.3 })
  },
}
const SND = { on: true, kind: 'Рояль' }
async function playSound() {
  if (!SND.on) return
  if (AC.state === 'suspended') AC.resume()
  await READY
  SOUNDS[SND.kind](AC.currentTime + 0.02)
}

const VARIANTS = [
  {
    name: 'A · Сборка', tag: '≈1,5 с',
    text: 'Знак собирается из своих частей: две лопасти закручиваются с разных сторон, штрихи прилетают последними, в момент сцепки — короткая вспышка.',
    run(s) {
      const ns = 'http://www.w3.org/2000/svg'
      const parts = D_ALL.split(/(?<=Z)/).map((d) => {
        const p = document.createElementNS(ns, 'path')
        p.setAttribute('d', d); p.setAttribute('fill', 'currentColor')
        p.style.transformBox = 'view-box'; p.style.transformOrigin = '450px 450px'
        s.svg.append(p); return p
      })
      s.use.style.display = 'none'
      s.cleanup.push(() => { parts.forEach((p) => p.remove()); s.use.style.display = '' })
      s.svg.style.opacity = 1
      const from = [
        'rotate(-150deg) scale(0.7)', 'translate(-140px, 90px)',
        'rotate(150deg) scale(0.7)', 'translate(140px, -90px)',
      ]
      const delay = [0, 260, 80, 340]
      parts.forEach((p, i) => anim(p, [
        { transform: from[i], opacity: 0 },
        { transform: 'none', opacity: 1 },
      ], { delay: delay[i], duration: 760, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }))
      anim(s.svg, GLOW, { delay: 640, duration: 600, easing: SOFT, fill: 'none' })
      anim(s.svg, [{ scale: 1 }, { scale: 1.04 }, { scale: 1 }], { delay: 640, duration: 420, easing: SOFT, fill: 'none' })
      exit(s, 1080)
    },
  },
  {
    name: 'B · Комета', tag: '≈1,6 с',
    text: 'Светящаяся точка обводит контур знака, оставляя тающий хвост; когда контур замкнулся — знак заливается светом.',
    run(s) {
      const { ctx, c, g } = canvas(s)
      const pts = SAMPLES.map((p) => { const m = g.map(p[0], p[1]); m.brk = p.brk; return m })
      const N = pts.length, TAIL = 110
      loop(s, 820, (ms) => {
        const k = Math.floor(eio(clamp(ms / 780)) * (N - 1))
        ctx.clearRect(0, 0, g.w, g.h)
        ctx.lineCap = 'round'
        ctx.strokeStyle = 'rgba(245,245,246,0.32)'; ctx.lineWidth = 1.2
        ctx.beginPath()
        for (let i = 0; i <= k; i++) (i === 0 || pts[i].brk ? ctx.moveTo : ctx.lineTo).apply(ctx, pts[i])
        ctx.stroke()
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 10
        for (let i = Math.max(1, k - TAIL); i <= k; i++) {
          if (pts[i].brk) continue
          const a = 1 - (k - i) / TAIL
          ctx.strokeStyle = `rgba(255,255,255,${a * 0.95})`; ctx.lineWidth = 0.6 + a * 2.2
          ctx.beginPath(); ctx.moveTo(...pts[i - 1]); ctx.lineTo(...pts[i]); ctx.stroke()
        }
        if (ms < 780) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(...pts[k], 2.8, 0, 7); ctx.fill() }
        ctx.shadowBlur = 0
      })
      anim(c, [{ opacity: 1 }, { opacity: 0 }], { delay: 760, duration: 360, easing: SOFT, fill: 'forwards' })
      anim(s.svg, [{ opacity: 0 }, { opacity: 1 }], { delay: 700, duration: 360, easing: SOFT, fill: 'both' })
      anim(s.svg, GLOW, { delay: 700, duration: 700, easing: SOFT, fill: 'none' })
      exit(s, 1180)
    },
  },
  {
    name: 'C · Частицы', tag: '≈1,6 с',
    text: 'Облако точек по спирали стягивается к центру и ложится ровно по контуру знака, потом знак проступает сквозь них.',
    run(s) {
      const { ctx, c, g } = canvas(s)
      const R = Math.max(g.w, g.h) * 0.55
      const ps = SAMPLES.filter((_, i) => i % 2 === 0).map((p) => {
        const [tx, ty] = g.map(p[0], p[1])
        const rt = Math.hypot(tx - g.cx, ty - g.cy), at = Math.atan2(ty - g.cy, tx - g.cx)
        return { rt, at, rs: R * (0.5 + Math.random() * 0.6), as: at - 1.2 - Math.random() * 1.4,
          d: Math.random() * 220, sz: 1 + Math.random() * 1.1 }
      })
      loop(s, 1000, (ms) => {
        ctx.clearRect(0, 0, g.w, g.h)
        for (const p of ps) {
          const t = clamp((ms - p.d) / 720), e = eo3(t)
          const r = p.rs + (p.rt - p.rs) * e, a = p.as + (p.at - p.as) * e
          ctx.fillStyle = `rgba(245,245,246,${0.15 + 0.75 * clamp(t * 2)})`
          ctx.fillRect(g.cx + Math.cos(a) * r - p.sz / 2, g.cy + Math.sin(a) * r - p.sz / 2, p.sz, p.sz)
        }
      })
      anim(s.svg, [{ opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0)' }], { delay: 760, duration: 380, easing: SOFT, fill: 'both' })
      anim(c, [{ opacity: 1 }, { opacity: 0 }], { delay: 820, duration: 320, easing: SOFT, fill: 'forwards' })
      exit(s, 1180)
    },
  },
  {
    name: 'D · Сонар-поле', tag: '≈1,4 с · со звуком',
    text: 'Фон — поле точек. Из центра по нему проходят две волны, точки вспыхивают и расступаются, знак мягко докручивается на месте.',
    run(s) {
      playSound()
      const { ctx, g } = canvas(s)
      const STEP = Math.max(14, g.L / 7), maxR = Math.hypot(g.w, g.h) / 2 + 40
      const dots = []
      for (let x = (g.w % STEP) / 2; x < g.w; x += STEP)
        for (let y = (g.h % STEP) / 2; y < g.h; y += STEP) dots.push([x, y, Math.hypot(x - g.cx, y - g.cy), Math.atan2(y - g.cy, x - g.cx)])
      const W = STEP * 1.8
      loop(s, 1500, (ms) => {
        ctx.clearRect(0, 0, g.w, g.h)
        const base = 0.08 * clamp(ms / 200)
        const waves = [0, 240].map((st) => eo3(clamp((ms - st) / 1150)) * maxR)
        for (const [x, y, d, a] of dots) {
          let b = 0
          for (const r of waves) if (r > 0) b += Math.exp(-(((d - r) / W) ** 2))
          const fade = clamp(1 - d / maxR * 0.6)
          const off = b * STEP * 0.35
          ctx.fillStyle = `rgba(245,245,246,${(base + b * 0.8) * fade})`
          const sz = 1.4 + b * 1.4
          ctx.fillRect(x + Math.cos(a) * off - sz / 2, y + Math.sin(a) * off - sz / 2, sz, sz)
        }
      })
      anim(s.svg, [
        { opacity: 0, transform: 'rotate(-220deg) scale(0.8)', filter: 'blur(8px)' },
        { opacity: 1, transform: 'none', filter: 'blur(0)' },
      ], { delay: 100, duration: 900, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'both' })
      exit(s, 1020)
    },
  },
  {
    name: 'E · Прорисовка с оборотом', tag: '≈1,5 с',
    text: 'Твои два любимых вместе: контур рисуется, пока знак докручивается и тормозит, потом заливка и вспышка.',
    run(s) {
      const len = Math.ceil(LEN)
      s.svg.style.opacity = 1
      s.use.setAttribute('stroke', 'currentColor'); s.use.setAttribute('stroke-width', '5')
      s.cleanup.push(() => { s.use.removeAttribute('stroke'); s.use.removeAttribute('stroke-width') })
      anim(s.use, [
        { strokeDasharray: `${len}`, strokeDashoffset: len, fillOpacity: 0 },
        { strokeDasharray: `${len}`, strokeDashoffset: 0, fillOpacity: 0, offset: 0.66 },
        { strokeDasharray: `${len}`, strokeDashoffset: 0, fillOpacity: 1 },
      ], { duration: 920, easing: INOUT })
      anim(s.svg, [
        { transform: 'rotate(-160deg) scale(0.86)' },
        { transform: 'none' },
      ], { duration: 980, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'backwards' })
      anim(s.svg, GLOW, { delay: 760, duration: 620, easing: SOFT, fill: 'none' })
      exit(s, 1120)
    },
  },
  {
    name: 'F · Эквалайзер', tag: '≈1,5 с',
    text: 'Сначала «играет» эквалайзер, потом полосы стягиваются в точку, и из неё раскрывается знак.',
    run(s) {
      const { ctx, c, g } = canvas(s)
      const n = 11, bw = g.L * 0.055, gap = g.L * 0.045
      const x0 = g.cx - ((n - 1) * (bw + gap)) / 2
      loop(s, 900, (ms) => {
        ctx.clearRect(0, 0, g.w, g.h)
        const env = eo3(clamp(ms / 260))
        const k = eio(clamp((ms - 520) / 320))
        for (let i = 0; i < n; i++) {
          const center = 1 - Math.abs(i - (n - 1) / 2) / ((n - 1) / 2) * 0.55
          const h0 = g.L * (0.12 + 0.6 * center * Math.abs(Math.sin(ms / 120 + i * 0.75))) * env
          const h = h0 * (1 - k) + 2
          const x = g.cx + (x0 + i * (bw + gap) - g.cx) * (1 - k)
          ctx.fillStyle = `rgba(245,245,246,${0.9 * (1 - k * 0.8)})`
          ctx.beginPath(); ctx.roundRect(x - bw / 2, g.cy - h / 2, bw, h, bw / 2); ctx.fill()
        }
      })
      anim(c, [{ opacity: 1 }, { opacity: 0 }], { delay: 760, duration: 200, easing: SOFT, fill: 'forwards' })
      anim(s.svg, [
        { opacity: 0, transform: 'scale(0.4) rotate(-60deg)', filter: 'blur(10px)' },
        { opacity: 1, transform: 'none', filter: 'blur(0)' },
      ], { delay: 740, duration: 560, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'both' })
      anim(s.svg, GLOW, { delay: 780, duration: 600, easing: SOFT, fill: 'none' })
      exit(s, 1200)
    },
  },
]

const grid = document.getElementById('grid')
const tpl = document.getElementById('tpl')
const stages = []

VARIANTS.forEach((v) => {
  const card = tpl.content.firstElementChild.cloneNode(true)
  card.querySelector('h2').innerHTML = `${v.name} <span>${v.tag}</span>`
  card.querySelector('p').textContent = v.text
  grid.append(card)
  const stage = card.querySelector('.stage')
  let gen = 0
  const st = { cleanup: [], frames: [] }
  const play = () => {
    st.cleanup.forEach((f) => f()); st.cleanup = []; st.frames = []
    stage.getAnimations({ subtree: true }).forEach((a) => a.cancel())
    const my = ++gen
    Object.assign(st, {
      stage, splash: stage.querySelector('.splash'), svg: stage.querySelector('.splash svg'),
      use: stage.querySelector('.splash svg use:last-of-type'), app: stage.querySelector('.app'),
      mini: stage.querySelector('.mini'), alive: () => my === gen,
    })
    st.svg.style.opacity = ''; st.svg.style.filter = ''
    st.svg.querySelectorAll('use').forEach((u) => u.removeAttribute('transform'))
    st.use = st.svg.querySelector('use')
    requestAnimationFrame(() => v.run(st))
  }
  stage.addEventListener('click', play)
  card.querySelector('[data-act=play]').onclick = play
  if (v.name.startsWith('D')) {
    const sel = document.createElement('select')
    sel.innerHTML = Object.keys(SOUNDS).map((k) => '<option>' + k + '</option>').join('')
    sel.value = SND.kind
    sel.onchange = () => { SND.kind = sel.value; play() }
    card.querySelector('.row').append(sel)
  }
  card.querySelector('[data-act=full]').onclick = async () => { await stage.requestFullscreen(); setTimeout(play, 250) }
  stages.push(play); stage.__st = st
})

document.getElementById('snd').onchange = (e) => (SND.on = e.target.checked)
document.getElementById('all').onclick = () => stages.forEach((p) => p())
setTimeout(() => stages.forEach((p) => p()), 400)
</script>
</body>
