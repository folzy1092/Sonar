<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Sonar — варианты заставки</title>
<style>
  :root { color-scheme: dark; --bg: #050506; --fg: #f5f5f6; --muted: #8b8b93; --line: #1d1d22; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0b0d; color: var(--fg);
    font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    padding: clamp(14px, 3vw, 32px) clamp(14px, 3vw, 40px) 60px;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 20px; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  button {
    font: inherit; color: var(--fg); background: #17171b; border: 1px solid #26262c;
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease;
  }
  button:hover { background: #1f1f24; border-color: #33333a; }
  #all { margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 28px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 12px 0 2px; display: flex; gap: 8px; align-items: center; }
  .card h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .card p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; }

  /* сцена: макет интерфейса + заставка поверх */
  .stage {
    position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 12px;
    border: 1px solid var(--line); background: #0e0e11; container-type: size; cursor: pointer;
  }
  .stage:fullscreen { border-radius: 0; border: 0; aspect-ratio: auto; }
  .app { position: absolute; inset: 0; display: grid; grid-template-columns: 19% 1fr; gap: 1.4cqh; padding: 1.4cqh; }
  .side, .main { background: #131317; border-radius: 1.6cqh; }
  .side { padding: 3cqh 2cqh; display: flex; flex-direction: column; gap: 2.2cqh; }
  .side i { display: block; height: 2.2cqh; border-radius: 1cqh; background: #1f1f25; }
  .side i:nth-child(1) { width: 60%; background: #2a2a31; }
  .side i:nth-child(odd) { width: 74%; }
  .main { padding: 3cqh; display: flex; flex-direction: column; gap: 3cqh; }
  .search { height: 5cqh; width: 46%; border-radius: 2.5cqh; background: #1c1c21; }
  .hero { height: 26cqh; border-radius: 1.6cqh; background: linear-gradient(120deg, #2b1d3a, #13243a 60%, #102a2a); }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2cqh; }
  .tiles b { aspect-ratio: 1; border-radius: 1.2cqh; background: #1d1d22; }
  .tiles b:nth-child(1) { background: linear-gradient(135deg, #5a2c2c, #2a1616); }
  .tiles b:nth-child(2) { background: linear-gradient(135deg, #2c4a5a, #142229); }
  .tiles b:nth-child(3) { background: linear-gradient(135deg, #4a4a2c, #222214); }
  .tiles b:nth-child(4) { background: linear-gradient(135deg, #3a2c5a, #191429); }
  .tiles b:nth-child(5) { background: linear-gradient(135deg, #2c5a3e, #14291c); }
  .mini { position: absolute; left: 1.4cqh; right: 1.4cqh; bottom: 1.4cqh; height: 9cqh; border-radius: 1.6cqh; background: #18181d; }
  .app { padding-bottom: 12cqh; }

  .splash { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); }
  .splash svg { width: min(112px, 20cqh); height: min(112px, 20cqh); overflow: visible; color: var(--fg); opacity: 0; }
  .ring {
    position: absolute; left: 50%; top: 50%; width: min(112px, 20cqh); aspect-ratio: 1;
    translate: -50% -50%; border-radius: 50%; border: 1px solid rgb(245 245 246 / 0.5); opacity: 0;
  }
  .sheen { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Заставка Sonar — варианты</h1>
  <p>Клик по сцене — повторить. «На весь экран» — как в настоящем окне.</p>
  <button id="all">Повторить все</button>
</header>
<div class="grid" id="grid"></div>

<svg width="0" height="0" style="position:absolute">
  <defs><path id="logo" fill-rule="evenodd" d="M244.1 917.6C244.4 917.3 251.9 915.7 260.7 914.0C336.9 899.8 417.1 875.8 476.5 849.5C558.3 813.3 619.4 767.3 654.0 715.7C671.2 690.1 681.9 661.6 685.0 633.2C686.8 617.5 685.8 595.7 683.0 586.0C671.0 544.5 630.9 504.6 560.5 464.0C548.4 457.1 506.8 435.7 492.5 429.2L483.5 425.1L497.5 425.1C529.0 424.9 580.9 428.1 613.0 432.1C703.1 443.3 761.6 466.9 796.5 506.0C841.5 556.5 830.9 619.4 765.9 687.4C705.1 751.1 629.7 803.6 541.8 843.3C455.5 882.4 357.3 908.2 266.0 916.0C259.1 916.6 251.3 917.3 248.5 917.6C245.8 917.9 243.8 917.9 244.1 917.6ZM258.1 847.6C258.3 847.4 265.5 846.0 274.0 844.6C365.5 829.0 447.9 797.3 506.7 755.2C551.1 723.4 589.3 681.0 615.0 635.2C618.4 629.0 621.5 624.0 621.8 624.0C622.8 624.0 620.9 639.1 618.5 648.6C615.4 661.7 611.3 672.5 603.6 688.4C593.0 710.1 581.0 726.4 563.5 742.8C505.4 797.1 406.3 833.1 279.6 846.0C258.1 848.2 257.5 848.2 258.1 847.6ZM485.0 597.9C366.7 592.9 284.2 570.4 240.9 531.3C186.8 482.5 186.4 424.2 239.8 357.3C260.5 331.4 302.5 292.2 338.3 265.2C454.9 177.6 607.3 121.0 762.5 107.6C778.9 106.2 784.3 106.2 776.4 107.5C763.4 109.8 734.7 115.7 717.6 119.6C548.3 158.5 426.0 224.8 370.0 308.3C352.8 333.9 342.1 362.4 339.0 390.8C337.2 406.5 338.2 428.3 341.0 438.0C353.0 479.5 393.1 519.4 463.5 560.0C475.6 566.9 517.2 588.3 531.5 594.8L540.5 598.9L522.0 598.8C511.8 598.7 495.2 598.3 485.0 597.9ZM402.4 392.6C403.2 383.4 406.9 368.0 411.0 357.1C415.3 345.3 425.9 323.9 431.7 315.0C474.7 249.5 574.6 201.5 707.0 182.5C727.1 179.7 765.0 175.7 765.7 176.4C766.0 176.6 764.0 177.2 761.3 177.5C750.5 179.1 723.5 184.4 707.0 188.2C620.0 208.3 549.3 241.0 494.3 286.4C462.1 313.1 429.5 352.2 409.0 388.8C405.6 395.0 402.5 400.0 402.2 400.0C402.0 400.0 402.0 396.7 402.4 392.6Z" /></defs>
</svg>

<template id="tpl">
  <div class="card">
    <div class="stage">
      <div class="app">
        <div class="side"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="main"><div class="search"></div><div class="hero"></div><div class="tiles"><b></b><b></b><b></b><b></b><b></b></div></div>
      </div>
      <div class="mini"></div>
      <div class="splash">
        <svg viewBox="62 62 900 900"><use href="#logo" fill="currentColor" /></svg>
      </div>
    </div>
    <h2></h2>
    <p></p>
    <div class="row"><button data-act="play">Повторить</button><button data-act="full">На весь экран</button></div>
  </div>
</template>

<script>
CSS.registerProperty?.({ name: '--r', syntax: '<length>', inherits: false, initialValue: '0px' })

const OUT = 'cubic-bezier(0.22, 1, 0.36, 1)'      // мягкое торможение
const INOUT = 'cubic-bezier(0.65, 0, 0.35, 1)'    // плавно туда-обратно
const SOFT = 'cubic-bezier(0.4, 0, 0.2, 1)'

const anim = (el, frames, o) => el.animate(frames, { fill: 'both', easing: OUT, ...o })

// общий уход: фон гаснет, интерфейс «наводится на резкость» — без сдвигов
function reveal(s, at, dur = 620) {
  anim(s.splash, [{ opacity: 1 }, { opacity: 0 }], { delay: at, duration: dur, easing: SOFT })
  anim(s.app, [{ filter: 'blur(10px)', scale: 1.025 }, { filter: 'blur(0)', scale: 1 }], { delay: at - 40, duration: dur + 200 })
  anim(s.mini, [{ filter: 'blur(10px)', opacity: 0.6 }, { filter: 'blur(0)', opacity: 1 }], { delay: at - 40, duration: dur + 200 })
}

const VARIANTS = [
  {
    name: 'Сейчас', tag: 'для сравнения',
    text: 'Как в приложении сейчас: пропеллер с разгоном и следами, растворяется на ходу.',
    run(s) {
      const svg = s.svg, trails = []
      for (let i = 0; i < 4; i++) {
        const u = s.use.cloneNode(); u.setAttribute('opacity', 0); svg.prepend(u); trails.push(u)
      }
      s.cleanup.push(() => trails.forEach((u) => u.remove()))
      const t0 = performance.now()
      const f = (now) => {
        const ms = now - t0, t = Math.min(1, ms / 1000), a = 1260 * t ** 3, v = 3 * t * t
        svg.style.opacity = Math.min(1, ms / 140)
        s.use.setAttribute('transform', `rotate(${a} 512 512)`)
        trails.forEach((u, i) => {
          u.setAttribute('transform', `rotate(${a - (i + 1) * 9 * v} 512 512)`)
          u.setAttribute('opacity', Math.min(1, v / 2) * (0.32 - i * 0.07))
        })
        if (ms < 1200 && s.alive()) requestAnimationFrame(f)
      }
      requestAnimationFrame(f)
      anim(s.splash, [{ opacity: 1 }, { opacity: 0 }], { delay: 420, duration: 640, easing: SOFT })
      anim(svg, [{ scale: 1, filter: 'blur(0)' }, { scale: 1.12, filter: 'blur(3px)' }], { delay: 420, duration: 640, easing: SOFT })
    },
  },
  {
    name: '1 · Проявление', tag: '≈1,1 с',
    text: 'Знак проявляется из размытия, секунду «дышит» и растворяется, а интерфейс за ним наводится на резкость.',
    run(s) {
      anim(s.svg, [
        { opacity: 0, scale: 0.9, filter: 'blur(10px)' },
        { opacity: 1, scale: 1, filter: 'blur(0)' },
      ], { duration: 560 })
      anim(s.svg, [{ scale: 1, opacity: 1, filter: 'blur(0)' }, { scale: 1.06, opacity: 0, filter: 'blur(6px)' }],
        { delay: 620, duration: 520, easing: SOFT, fill: 'forwards' })
      reveal(s, 680)
    },
  },
  {
    name: '2 · Пинг', tag: '≈1,3 с',
    text: 'Как сонар: от знака расходятся две волны, и последняя мягко раскрывает интерфейс кругом из центра.',
    run(s) {
      anim(s.svg, [{ opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1 }], { duration: 420 })
      ;[0, 1].forEach((i) => {
        const r = document.createElement('div'); r.className = 'ring'; s.splash.append(r)
        s.cleanup.push(() => r.remove())
        anim(r, [{ opacity: 0.55, scale: 1 }, { opacity: 0, scale: 5.5 }], { delay: 260 + i * 200, duration: 1000 })
      })
      anim(s.svg, [{ opacity: 1, scale: 1 }, { opacity: 0, scale: 0.96 }], { delay: 760, duration: 420, easing: SOFT, fill: 'forwards' })
      s.splash.style.mask = 'radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 18cqh))'
      s.cleanup.push(() => (s.splash.style.mask = ''))
      anim(s.splash, [{ '--r': '-20cqh' }, { '--r': '110cqw' }], { delay: 640, duration: 820, easing: INOUT })
      anim(s.app, [{ scale: 1.03, filter: 'blur(6px)' }, { scale: 1, filter: 'blur(0)' }], { delay: 640, duration: 900 })
    },
  },
  {
    name: '3 · Прорисовка', tag: '≈1,4 с',
    text: 'Контур знака рисуется линией, заливается светом и растворяется вместе с фоном.',
    run(s) {
      const len = Math.ceil(document.getElementById('logo').getTotalLength())
      const p = s.use
      p.setAttribute('fill', 'currentColor'); p.setAttribute('stroke', 'currentColor'); p.setAttribute('stroke-width', '5')
      s.svg.style.opacity = 1
      const stroke = s.svg.querySelector('use')
      anim(stroke, [{ strokeDasharray: `${len}`, strokeDashoffset: len, fillOpacity: 0 },
        { strokeDasharray: `${len}`, strokeDashoffset: 0, fillOpacity: 0, offset: 0.62 },
        { strokeDasharray: `${len}`, strokeDashoffset: 0, fillOpacity: 1 }], { duration: 860, easing: INOUT })
      anim(s.svg, [{ opacity: 1, scale: 1 }, { opacity: 0, scale: 1.05, filter: 'blur(5px)' }], { delay: 940, duration: 480, easing: SOFT, fill: 'forwards' })
      s.cleanup.push(() => { p.removeAttribute('stroke'); p.removeAttribute('stroke-width') })
      reveal(s, 980)
    },
  },
  {
    name: '4 · Мягкий оборот', tag: '≈1,1 с',
    text: 'Наш пропеллер наоборот: знак влетает уже раскрученным и плавно останавливается, следы тают — без рывка в конце.',
    run(s) {
      const svg = s.svg, trails = []
      for (let i = 0; i < 3; i++) {
        const u = s.use.cloneNode(); u.setAttribute('opacity', 0); svg.prepend(u); trails.push(u)
      }
      s.cleanup.push(() => trails.forEach((u) => u.remove()))
      const D = 900, TURN = 540, t0 = performance.now()
      const f = (now) => {
        const ms = now - t0, t = Math.min(1, ms / D)
        const a = -TURN * (1 - t) ** 4      // торможение: быстрый вход, ровная остановка
        const v = 4 * (1 - t) ** 3          // скорость 4…0
        svg.style.opacity = Math.min(1, ms / 260)
        svg.style.filter = `blur(${Math.max(0, 6 * (1 - ms / 300))}px)`
        s.use.setAttribute('transform', `rotate(${a} 512 512)`)
        trails.forEach((u, i) => {
          u.setAttribute('transform', `rotate(${a - (i + 1) * 7 * v} 512 512)`)
          u.setAttribute('opacity', Math.min(1, v / 2) * (0.28 - i * 0.08))
        })
        if (ms < D + 40 && s.alive()) requestAnimationFrame(f)
      }
      requestAnimationFrame(f)
      anim(svg, [{ scale: 1 }, { scale: 1.05, opacity: 0 }], { delay: 760, duration: 480, easing: SOFT, fill: 'forwards' })
      reveal(s, 800)
    },
  },
  {
    name: '5 · Блик', tag: '≈1,2 с',
    text: 'Знак спокойно проявляется, по нему проходит один мягкий блик, и всё уходит в интерфейс.',
    run(s) {
      anim(s.svg, [{ opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1 }], { duration: 480 })
      const svg = s.svg
      const ns = 'http://www.w3.org/2000/svg'
      const id = 'g' + Math.random().toString(36).slice(2)
      const defs = document.createElementNS(ns, 'defs')
      defs.innerHTML = `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="900">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`
      const shine = s.use.cloneNode(); shine.setAttribute('fill', `url(#${id})`)
      svg.append(defs, shine)
      s.use.setAttribute('fill', '#9a9aa3')
      s.cleanup.push(() => { defs.remove(); shine.remove(); s.use.setAttribute('fill', 'currentColor') })
      const g = defs.querySelector('linearGradient')
      const t0 = performance.now()
      const f = (now) => {
        const t = Math.min(1, Math.max(0, (now - t0 - 220) / 700))
        const e = t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2
        const x = -700 + e * 1800
        g.setAttribute('x1', x); g.setAttribute('y1', x); g.setAttribute('x2', x + 600); g.setAttribute('y2', x + 600)
        if (t < 1 && s.alive()) requestAnimationFrame(f)
      }
      requestAnimationFrame(f)
      anim(s.use, [{ fill: '#9a9aa3' }, { fill: '#f5f5f6' }], { delay: 420, duration: 500, easing: INOUT })
      anim(svg, [{ opacity: 1, scale: 1 }, { opacity: 0, scale: 1.04, filter: 'blur(4px)' }], { delay: 860, duration: 480, easing: SOFT, fill: 'forwards' })
      reveal(s, 900)
    },
  },
]

const grid = document.getElementById('grid')
const tpl = document.getElementById('tpl')
const stages = []

VARIANTS.forEach((v) => {
  const card = tpl.content.firstElementChild.cloneNode(true)
  card.querySelector('h2').innerHTML = `${v.name} <span>${v.tag}</span>`
  card.querySelector('p').textContent = v.text
  grid.append(card)
  const stage = card.querySelector('.stage')
  let gen = 0
  const st = { cleanup: [] }
  const play = () => {
    st.cleanup.forEach((f) => f()); st.cleanup = []
    stage.getAnimations({ subtree: true }).forEach((a) => a.cancel())
    const my = ++gen
    Object.assign(st, {
      stage, splash: stage.querySelector('.splash'), svg: stage.querySelector('.splash svg'),
      use: stage.querySelector('.splash svg use:last-of-type'), app: stage.querySelector('.app'),
      mini: stage.querySelector('.mini'), alive: () => my === gen,
    })
    st.svg.style.opacity = ''; st.svg.style.filter = ''
    st.svg.querySelectorAll('use').forEach((u) => u.removeAttribute('transform'))
    st.use = st.svg.querySelector('use')
    requestAnimationFrame(() => v.run(st))
  }
  stage.addEventListener('click', play)
  card.querySelector('[data-act=play]').onclick = play
  card.querySelector('[data-act=full]').onclick = async () => { await stage.requestFullscreen(); setTimeout(play, 250) }
  stages.push(play)
})

document.getElementById('all').onclick = () => stages.forEach((p) => p())
setTimeout(() => stages.forEach((p) => p()), 400)
</script>
</body>
</html>
