<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonar — значки приложения</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 32px; background: #0d0d0f; color: #e8e8ec; font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 240px); gap: 24px; }
  figure { margin: 0; }
  img { width: 240px; height: 240px; border-radius: 54px; display: block; }
  figcaption { margin-top: 8px; display: grid; gap: 2px; }
  figcaption span { color: #9a9aa4; font-size: 13px; }
</style></head>
<body>
  <h1>Значки приложения Sonar — основной «Стекло» и ещё 9</h1>
  <div class="grid">
    <figure><img src="glass.svg" alt="Стекло"><figcaption><b>1. Стекло</b><span>Матовое стекло: блик по верху, тёмный низ, светящийся край.</span></figcaption></figure>
    <figure><img src="flat.svg" alt="Плоский"><figcaption><b>2. Плоский</b><span>Прежний значок: белая S без объёма.</span></figcaption></figure>
    <figure><img src="bevel.svg" alt="Фаска"><figcaption><b>3. Фаска</b><span>Как вырезанный из металла знак: грань плоская, края скошены.</span></figcaption></figure>
    <figure><img src="puff.svg" alt="Подушка"><figcaption><b>4. Подушка</b><span>Вздутый глянцевый объём, как надувной знак. Эхо остаётся тонким.</span></figcaption></figure>
    <figure><img src="block.svg" alt="Блок"><figcaption><b>5. Блок</b><span>Знак — толстая объёмная деталь: видна боковая стенка, под ней тень.</span></figcaption></figure>
    <figure><img src="echo.svg" alt="Эхо"><figcaption><b>6. Эхо</b><span>Лопасти выпуклые, а «эхо» — вдавленные в плиту канавки: два уровня глубины.</span></figcaption></figure>
    <figure><img src="well.svg" alt="Колодец"><figcaption><b>7. Колодец</b><span>Плита вогнута чашей, по дну идут кольца эха, знак вздут над ней. Глубина и в плите, и в самом знаке.</span></figcaption></figure>
    <figure><img src="chrome.svg" alt="Хром"><figcaption><b>8. Хром</b><span>Зеркальный металл с тёмной линией горизонта по центру. Самый «железный» из набора.</span></figcaption></figure>
    <figure><img src="carved.svg" alt="Вдавленный"><figcaption><b>9. Вдавленный</b><span>Знак продавлен в тёмную плиту: тень сверху внутри, светлая кромка снизу.</span></figcaption></figure>
    <figure><img src="light.svg" alt="Светлый"><figcaption><b>10. Светлый</b><span>Светлая плита и мягкая вмятина. Для светлой темы и бумажных носителей.</span></figcaption></figure>
  </div>
</body></html>
