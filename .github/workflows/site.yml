# Сайт try-sonar.ru (site/, Astro) → архив site.tar.gz в служебном релизе site-latest. Спека — docs/SITE.md.
# Раздаёт его сервер на Velt: server/deploy/sync.py при старте скачивает новый архив в site/ (SERVER_PROMPT этап 6).
# GitHub Pages больше не нужен (2026-11-26) — его можно выключить в Settings → Pages.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'updates/**'
      - 'brand/**'
      - 'windows/src/lib/subscription.ts'
      - 'windows/src/lib/share-link.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # типы TS и .astro (astro check)
      - run: npm run check

      # тесты сверяют цены с windows/src/lib/subscription.ts и переводы en / uk
      - run: npm test

      - run: npm run build

      - name: Выложить в релиз site-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf ../site.tar.gz -C dist .
          gh release view site-latest > /dev/null 2>&1 || \
            gh release create site-latest --target "$GITHUB_SHA" --latest=false \
              --title "Сайт try-sonar.ru — последняя сборка" \
              --notes "Служебный релиз: архив собранного сайта. Сервер забирает его при перезапуске."
          gh release upload site-latest ../site.tar.gz --clobber
          gh release edit site-latest --latest=false \
            --notes "Служебный релиз: архив собранного сайта из ${GITHUB_SHA::7}. Сервер забирает его при перезапуске."
