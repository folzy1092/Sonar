# Сайт sonar.folzy.ru (site/, Astro) → GitHub Pages. Спека — docs/SITE.md.
# В настройках репо: Pages → Source: GitHub Actions; домен берётся из site/public/CNAME.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'updates/**'
      - 'brand/**'
      - 'windows/src/lib/subscription.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # тесты сверяют цены с windows/src/lib/subscription.ts и переводы en / uk
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
