name: iOS

# Сборка iPhone-клиента (Mac у владельца нет — только здесь): XcodeGen → тесты на симуляторе →
# `xcodebuild archive` без подписи → Payload/Sonar.app → Sonar.ipa (артефакт запуска).
# Подписывает IPA пользователь своей парой (P12 + mobileprovision): ESign / Feather, а потом само
# приложение при автообновлении (порт ShadowSelfUpdate, SPEC §4.6).
# Релиз `ios-build-<N>` + `updates/update.json` — следующим шагом (docs/IOS_PROMPT.md, этап «Релизы»).
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
        # с явным bash GitHub включает pipefail: падение xcodebuild не прячется за xcbeautify
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.app

      - name: XcodeGen
        run: |
          brew install xcodegen
          # номер сборки — число коммитов (SPEC §5)
          BUILD=$(git rev-list --count HEAD)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          xcodegen generate

      - name: Тесты
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project Sonar.xcodeproj -scheme Sonar -destination "id=$DEST" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Сборка IPA
        run: |
          xcodebuild archive -project Sonar.xcodeproj -scheme Sonar -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Sonar.xcarchive \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD" | xcbeautify
          mkdir -p build/Payload
          cp -R build/Sonar.xcarchive/Products/Applications/Sonar.app build/Payload/
          (cd build && zip -qry Sonar.ipa Payload)
          ls -lh build/Sonar.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Sonar-ios-${{ env.BUILD }}
          path: ios/build/Sonar.ipa
