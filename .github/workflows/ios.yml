name: iOS

# Сборка iPhone-клиента (Mac у владельца нет — только здесь): XcodeGen → тесты на симуляторе →
# `xcodebuild archive` без подписи → Payload/Sonar.app → Sonar.ipa.
# Подписывает IPA пользователь своей парой (P12 + mobileprovision): ESign / Feather, а потом само
# приложение при автообновлении (порт ShadowSelfUpdate, SPEC §4.6).
#
# Ветка dev — только тесты и сборка, без релиза.
# Каждая сборка из main — релиз `ios-build-<N>` (N = число коммитов = CFBundleVersion) с `Sonar.ipa`,
# и тот же файл — в служебном релизе `ios-latest`, постоянная ссылка на свежую сборку:
#   https://github.com/folzy1092/Sonar/releases/download/ios-latest/Sonar.ipa
# Оба релиза НЕ помечаются Latest: Latest занят Windows (releases/latest/download/Sonar-setup.exe).
# Объявляет обновление человек — правкой updates/ios-update.json (как «рубильник» в Shadow). Для
# удобства ручной запуск с `announce: true` после сборки сам вписывает в него новую сборку.
on:
  push:
    branches: [main, dev]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      announce:
        description: 'Объявить эту сборку в updates/ios-update.json (телефоны предложат обновиться)'
        type: boolean
        default: false
      title:
        description: 'Заголовок обновления (необязательно)'
        type: string
        default: ''

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    # секреты Last.fm (SONAR_LASTFM_KEY, LASTFM_API_SECRET) — в окружении default, как у windows.yml
    environment: default
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: ios
        # с явным bash GitHub включает pipefail: падение xcodebuild не прячется за xcbeautify
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.app

      - name: XcodeGen
        run: |
          brew install xcodegen
          # номер сборки — число коммитов (SPEC §5), версия Г.О.Ф — MARKETING_VERSION из project.yml
          BUILD=$(git rev-list --count HEAD)
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Sonar $VERSION ($BUILD)"
          xcodegen generate

      - name: Тестовая пара для подписи
        # самоподписанный сертификат на два дня — только для SigningTests (zsign подписывает фиктивный
        # .app); настоящих P12 в репозитории нет. Системный LibreSSL: его .p12 (3DES/SHA1) iOS открывает сама.
        run: |
          D="$RUNNER_TEMP/sonar-signing"
          mkdir -p "$D"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout "$D/key.pem" -out "$D/cert.pem" \
            -subj "/CN=Sonar Test/OU=ABCDE12345/O=Sonar Test"
          /usr/bin/openssl x509 -in "$D/cert.pem" -outform der -out "$D/cert.der"
          /usr/bin/openssl pkcs12 -export -inkey "$D/key.pem" -in "$D/cert.pem" -out "$D/test.p12" -passout pass:sonar \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          echo "SONAR_TEST_SIGNING=$D" >> "$GITHUB_ENV"

      - name: Тесты
        env:
          # переменные с префиксом TEST_RUNNER_ xcodebuild передаёт в процесс тестов без префикса
          TEST_RUNNER_SONAR_TEST_SIGNING: ${{ env.SONAR_TEST_SIGNING }}
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project Sonar.xcodeproj -scheme Sonar -destination "id=$DEST" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Сборка IPA
        env:
          # Last.fm — как в windows.yml (секрет называется LASTFM_API_SECRET); пусто — Last.fm в сборке нет
          SONAR_LASTFM_KEY: ${{ secrets.SONAR_LASTFM_KEY }}
          SONAR_LASTFM_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          SONAR_REPORT_BOT_TOKEN: ${{ secrets.SONAR_REPORT_BOT_TOKEN }}
          SONAR_REPORT_CHAT: ${{ secrets.SONAR_REPORT_CHAT }}
          SONAR_REPORT_THREAD: ${{ secrets.SONAR_REPORT_THREAD }}
        run: |
          xcodebuild archive -project Sonar.xcodeproj -scheme Sonar -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Sonar.xcarchive \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD" \
            SONAR_LASTFM_KEY="$SONAR_LASTFM_KEY" SONAR_LASTFM_SECRET="$SONAR_LASTFM_SECRET" \
            SONAR_REPORT_BOT_TOKEN="$SONAR_REPORT_BOT_TOKEN" SONAR_REPORT_CHAT="$SONAR_REPORT_CHAT" \
            SONAR_REPORT_THREAD="$SONAR_REPORT_THREAD" | xcbeautify
          mkdir -p build/Payload
          cp -R build/Sonar.xcarchive/Products/Applications/Sonar.app build/Payload/
          # виджет «Домой» встроен в приложение (без него сборка не нужна — ловим сразу)
          test -f build/Payload/Sonar.app/PlugIns/SonarWidget.appex/Info.plist
          ls build/Payload/Sonar.app/PlugIns
          (cd build && zip -qry Sonar.ipa Payload)
          ls -lh build/Sonar.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Sonar-ios-${{ env.BUILD }}
          path: ios/build/Sonar.ipa

      - name: Релиз ios-build-${{ env.BUILD }}
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="ios-build-$BUILD"
          # заметки — коммиты ios/ с прошлой iOS-сборки
          # первой сборке сравнивать не с чем: grep без совпадений не должен ронять шаг (pipefail)
          PREV=$(git tag -l 'ios-build-*' --sort=-v:refname | { grep -vx "$TAG" || true; } | head -1)
          RANGE=${PREV:+$PREV..}HEAD
          git log --no-merges --format='- %s' $RANGE -- . ../.github/workflows/ios.yml | head -40 > ../notes.md
          [ -s ../notes.md ] || echo "- Сборка $BUILD" > ../notes.md
          { echo "Sonar $VERSION ($BUILD) для iPhone. Ставится через ESign / Feather своей парой P12 + mobileprovision;"
            echo "дальше Sonar обновляется сам (Профиль → Автообновление)."
            echo; cat ../notes.md; } > ../release.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # перезапуск того же коммита — просто заменить файл
            gh release upload "$TAG" build/Sonar.ipa --clobber
          else
            gh release create "$TAG" build/Sonar.ipa --target "$GITHUB_SHA" \
              --title "Sonar $VERSION ($BUILD) для iPhone" --notes-file ../release.md --latest=false
          fi
          # постоянная ссылка на самую свежую IPA
          gh release view ios-latest > /dev/null 2>&1 || \
            gh release create ios-latest --target "$GITHUB_SHA" --latest=false \
              --title "Sonar для iPhone — последняя сборка" \
              --notes "Служебный релиз: здесь всегда самая свежая Sonar.ipa из main. Все сборки — релизы ios-build-*."
          gh release upload ios-latest build/Sonar.ipa --clobber
          gh release edit ios-latest --latest=false \
            --notes "Служебный релиз: здесь всегда Sonar.ipa последней сборки — сейчас $VERSION ($BUILD), ios-build-$BUILD. Все сборки — релизы ios-build-*."

      - name: Объявить обновление
        if: github.ref == 'refs/heads/main' && inputs.announce
        env:
          TITLE: ${{ inputs.title }}
        run: |
          cd ..
          git config user.name "Folzy"
          git config user.email "87141318+folzy1092@users.noreply.github.com"
          python3 - <<'PY'
          import json, os
          path = 'updates/ios-update.json'
          data = json.load(open(path, encoding='utf-8'))
          build, version = int(os.environ['BUILD']), os.environ['VERSION']
          base = 'https://github.com/folzy1092/Sonar/releases'
          data.update(enabled=True, build=build, version=version,
                      ipa_url=f'{base}/download/ios-build-{build}/Sonar.ipa',
                      url=f'{base}/tag/ios-build-{build}')
          if os.environ.get('TITLE'):
              data['title'] = os.environ['TITLE']
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          git add updates/ios-update.json
          git commit -m "updates: iOS — объявлена сборка $VERSION ($BUILD) [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep $((i * 5)); done
