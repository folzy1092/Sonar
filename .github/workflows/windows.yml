name: Windows

# Сборка ПК-клиента (Tauri 2) → установщик NSIS как артефакт.
# Релиз пока не публикуем — появится вместе с автообновлением (ROADMAP W6).
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        run: npm run check

      - name: Сборка
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v5
        with:
          name: sonar-windows-${{ github.run_number }}
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
